services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - alembic upgrade head && python -m seed && exec uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/db.sqlite3
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
