<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log in</title>
        <style>
        body {
            align-items: center;
            background: #f4f4f5;
            display: flex;
            font-family: system-ui, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        main {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            padding: 2rem;
            width: min(100% - 2rem, 22rem);
        }

        h1 {
            margin-top: 0;
        }

        label,
        input {
            display: block;
            width: 100%;
        }

        label {
            margin: 1rem 0 0.35rem;
        }

        input {
            box-sizing: border-box;
            border: 1px solid #a1a1aa;
            border-radius: 4px;
            padding: 0.65rem;
        }

        button {
            background: #18181b;
            border: 0;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            margin-top: 1.25rem;
            padding: 0.7rem 1rem;
            width: 100%;
        }

        .errorlist {
            color: #b91c1c;
            padding-left: 1.25rem;
        }
        </style>
    </head>
    <body>
        <main>
            <h1>Log in</h1>
            {% if form.non_field_errors %}
                {{ form.non_field_errors }}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
                {{ form.username.errors }}
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
                {{ form.password.errors }}
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <button type="submit">Log in</button>
            </form>
        </main>
    </body>
</html>
