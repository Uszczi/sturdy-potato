<section id="project-section" aria-labelledby="project-list-heading">
  <h2 id="project-list-heading" class="sr-only">Your projects</h2>
  {% if projects %}
    <ul
      class="divide-y divide-base-300 border-y border-base-300"
      data-drag-list
      data-drag-kind="project"
      data-drag-reorder-url="{% url 'project-reorder' %}"
      aria-describedby="project-list-help"
      aria-label="Project list"
    >
      {% for project in projects %}
        <li
          data-drag-item
          data-drag-kind="project"
          data-drag-id="{{ project.id }}"
          data-drag-label="{{ project.name }}"
          aria-grabbed="false"
        >
          <div
            class="group flex items-center gap-1 transition-colors hover:bg-base-200"
          >
            <button
              type="button"
              class="drag-handle ml-1 grid size-8 shrink-0 place-items-center rounded-md text-base-content/30 transition hover:bg-base-300 hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-primary sm:ml-2"
              draggable="true"
              data-drag-handle
              aria-label="Drag {{ project.name }} to reorder"
            >
              <svg
                aria-hidden="true"
                class="size-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              >
                <path
                  d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"
                />
              </svg>
            </button>
            <a
              id="project-{{ project.id }}"
              href="{% url 'project-detail-page' project.id %}"
              class="flex min-w-0 flex-1 items-center gap-3 px-2 py-3.5 transition-colors focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-primary sm:px-3"
            >
              <span
                class="size-2.5 shrink-0 rounded-full bg-primary/75"
                aria-hidden="true"
              ></span>
              <span class="min-w-0 flex-1">
                <span class="block truncate text-sm font-semibold"
                  >{{ project.name }}</span
                >
                <span class="mt-0.5 block text-xs text-base-content/50"
                  >{{ project.task_count }}
                  task{{ project.task_count|pluralize }}</span
                >
              </span>
              <svg
                aria-hidden="true"
                class="size-4 shrink-0 text-base-content/35"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m9 5 7 7-7 7"
                />
              </svg>
            </a>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <div class="border-y border-base-300 px-4 py-12 text-center sm:py-16">
      <span
        class="mx-auto grid size-10 place-items-center rounded-full bg-base-200 text-primary"
      >
        <svg
          aria-hidden="true"
          class="size-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 7h16M4 12h16M4 17h10"
          />
        </svg>
      </span>
      <h2 class="mt-3 text-lg font-semibold">No projects yet.</h2>
      <p class="mx-auto max-w-sm text-sm leading-6 text-base-content/65">
        Add a project above, then give related tasks a home.
      </p>
    </div>
  {% endif %}
</section>
