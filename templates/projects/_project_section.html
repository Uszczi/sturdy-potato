<section id="project-section" aria-labelledby="project-list-heading">
    <h2 id="project-list-heading" class="sr-only">Your projects</h2>
    {% if projects %}
        <ul class="divide-y divide-base-300 border-y border-base-300"
            aria-label="Project list">
            {% for project in projects %}
                <li>
                    <a id="project-{{ project.id }}"
                       href="{% url 'project-detail-page' project.id %}"
                       class="flex items-center gap-3 px-3 py-3.5 transition-colors hover:bg-base-200 focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-primary sm:px-4">
                        <span class="size-2.5 shrink-0 rounded-full bg-primary/75"
                              aria-hidden="true"></span>
                        <span class="min-w-0 flex-1">
                            <span class="block truncate text-sm font-semibold">{{ project.name }}</span>
                            <span class="mt-0.5 block text-xs text-base-content/50">{{ project.task_count }} task{{ project.task_count|pluralize }}</span>
                        </span>
                        <svg aria-hidden="true"
                             class="size-4 shrink-0 text-base-content/35"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke="currentColor"
                             stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7" />
                        </svg>
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="border-y border-base-300 px-4 py-12 text-center sm:py-16">
            <span class="mx-auto grid size-10 place-items-center rounded-full bg-base-200 text-primary">
                <svg aria-hidden="true"
                     class="size-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h10" />
                </svg>
            </span>
            <h2 class="mt-3 text-lg font-semibold">No projects yet.</h2>
            <p class="mx-auto max-w-sm text-sm leading-6 text-base-content/65">
                Add a project above, then give related tasks a home.
            </p>
        </div>
    {% endif %}
</section>
