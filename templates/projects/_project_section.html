<section id="project-section" aria-labelledby="project-list-heading">
    <h2 id="project-list-heading" class="sr-only">Your projects</h2>
    {% if projects %}
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            {% for project in projects %}
                <article class="card border border-base-300 bg-base-100 shadow-sm">
                    <div class="card-body">
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-primary">Project</p>
                        <h3 class="card-title">{{ project.name }}</h3>
                        <p class="text-sm text-base-content/60">{{ project.task_count }} task{{ project.task_count|pluralize }}</p>
                    </div>
                </article>
            {% endfor %}
        </div>
    {% else %}
        <div class="border-y border-base-300 px-6 py-12 text-center sm:py-16">
            <span class="badge badge-outline">A clean slate</span>
            <h2 class="mt-2 text-2xl font-bold">No projects yet.</h2>
            <p class="mx-auto max-w-sm text-sm leading-6 text-base-content/65">
                Create a project, then assign tasks to it from your inbox.
            </p>
        </div>
    {% endif %}
</section>
