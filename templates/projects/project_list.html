{% load django_vite %}
<!DOCTYPE html>
<html lang="en" data-theme="lofi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Projects</title>
        {% vite_asset 'assets/style.css' %}
        <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    </head>
    <body class="min-h-screen bg-base-200 text-base-content">
        <main class="container mx-auto min-h-screen px-4 py-6 sm:px-6 sm:py-10 lg:px-8">
            <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <p class="text-xs font-bold uppercase tracking-[0.2em] text-primary">Workspace</p>
                    <h1 class="mt-2 text-4xl font-black tracking-tight sm:text-5xl">Projects</h1>
                    <p class="mt-3 max-w-xl text-base-content/65">Keep related tasks together and give your inbox a little shape.</p>
                </div>
                <a href="{% url 'task-list-page' %}" class="btn btn-outline">Inbox</a>
            </header>
            <form class="mb-8 flex flex-col gap-2 sm:flex-row"
                  hx-post="{% url 'project-create-page' %}"
                  hx-target="#project-section"
                  hx-swap="outerHTML"
                  hx-on::after-request="if (event.detail.successful) this.reset()">
                {% csrf_token %}
                <label class="sr-only" for="project-name">New project name</label>
                <input id="project-name"
                       name="name"
                       type="text"
                       class="input input-bordered w-full sm:max-w-md"
                       placeholder="Add a project..."
                       maxlength="100"
                       autocomplete="off"
                       required>
                <button type="submit" class="btn btn-primary">Add project</button>
            </form>
            {% include "projects/_project_section.html" %}
        </main>
    </body>
</html>
