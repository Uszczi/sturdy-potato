<li
  id="task-{{ task.id }}"
  class="group cursor-pointer transition-colors duration-200 hover:bg-base-200/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  data-drag-item
  data-drag-kind="task"
  data-drag-id="{{ task.id }}"
  data-drag-label="{{ task.title }}"
  aria-grabbed="false"
  x-data="{
        open() {
            const data = this.$el.dataset;
            this.$dispatch('task-opened', {
                title: data.title,
                description: data.description,
                completed: data.completed === 'true',
                projectName: data.projectName,
                dueDate: data.dueDate,
                createdAt: data.createdAt,
                updatedAt: data.updatedAt
            });
        }
    }"
  data-title="{{ task.title }}"
  data-description="{{ task.description }}"
  data-completed="{{ task.completed|yesno:'true,false' }}"
  data-project-name="{% if task.project %}{{ task.project.name }}{% endif %}"
  data-due-date="{% if task.due_date %}{{ task.due_date|date:'M j, Y' }}{% endif %}"
  data-created-at="{{ task.created_at|date:'M j, Y g:i A' }}"
  data-updated-at="{{ task.updated_at|date:'M j, Y g:i A' }}"
  role="button"
  tabindex="0"
  @click="open()"
  @keydown.enter.prevent="open()"
  @keydown.space.prevent="open()"
>
  <div class="flex items-start gap-3 px-3 py-3 sm:px-4">
    <button
      type="button"
      class="drag-handle mt-0.5 grid size-5 shrink-0 place-items-center rounded text-base-content/25 transition hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      draggable="true"
      data-drag-handle
      aria-label="Drag {{ task.title }} to reorder"
      @click.stop
    >
      <svg
        aria-hidden="true"
        class="size-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" />
      </svg>
    </button>
    <form
      hx-post="{% url 'task-toggle' task.id %}{{ task_query }}"
      hx-trigger="submit"
      hx-target="#task-list"
      hx-swap="morph:innerHTML"
      class="mt-0.5 shrink-0"
      @click.stop
      @keydown.stop
    >
      {% csrf_token %}
      <button
        type="submit"
        class="{% if task.completed %}
          border-success bg-success text-success-content
        {% else %}
          border-base-content/30 text-transparent hover:border-primary
          hover:text-primary
        {% endif %} grid size-5 place-items-center rounded-full border-2 transition-colors"
        aria-pressed="{{ task.completed|yesno:'true,false' }}"
        aria-label="{% if task.completed %}
          Mark {{ task.title }} as open
        {% else %}
          Mark {{ task.title }} as complete
        {% endif %}"
      >
        <svg
          aria-hidden="true"
          class="size-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m5 12 4 4L19 6"
          />
        </svg>
      </button>
    </form>
    <div class="min-w-0 flex-1">
      <h2
        class="{% if task.completed %}text-base-content/45 line-through{% endif %} text-sm font-medium break-words"
      >
        {{ task.title }}
      </h2>
      {% if task.due_date %}
        <div class="mt-1 flex items-center gap-2 text-xs text-base-content/50">
          <svg
            aria-hidden="true"
            class="size-3.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect width="16" height="16" x="4" y="5" rx="2" />
            <path stroke-linecap="round" d="M8 3v4m8-4v4M4 10h16" />
          </svg>
          <span>{{ task.due_date|date:"M j" }}</span>
        </div>
      {% endif %}
    </div>
    <form
      hx-post="{% url 'task-assign-project' task.id %}{{ task_query }}"
      hx-trigger="change"
      hx-target="#task-section"
      hx-swap="innerHTML"
      class="shrink-0"
      @click.stop
      @keydown.stop
    >
      {% csrf_token %}
      <label class="sr-only" for="task-project-{{ task.id }}"
        >Project for {{ task.title }}</label
      >
      <select
        id="task-project-{{ task.id }}"
        name="project_id"
        class="select max-w-32 select-ghost text-xs font-medium text-base-content/50 opacity-70 transition select-xs group-hover:opacity-100 focus:opacity-100"
        aria-label="Project for {{ task.title }}"
      >
        <option value="">No project</option>
        {% for project in projects %}
          <option
            value="{{ project.id }}"
            {% if task.project_id == project.id %}selected{% endif %}
          >
            {{ project.name }}
          </option>
        {% endfor %}
      </select>
    </form>
    <span class="sr-only">Click the task title for details</span>
  </div>
</li>
