{% load django_vite %}
<!DOCTYPE html>
<html lang="en" data-theme="lofi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inbox</title>
        {% vite_asset 'assets/style.css' %}
        <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    </head>
    <body class="min-h-screen bg-base-200 text-base-content">
        <main
            class="container mx-auto min-h-screen px-4 py-6 sm:px-6 sm:py-10 lg:px-8"
            x-data="{
                modalOpen: false,
                selectedTask: {
                    title: '',
                    description: '',
                    completed: false,
                    createdAt: '',
                    updatedAt: ''
                }
            }"
            @task-opened.window="selectedTask = $event.detail; modalOpen = true"
            @keydown.escape.window="modalOpen = false"
        >
            <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                <h1 class="mt-2 text-4xl font-black tracking-tight sm:text-5xl">Inbox</h1>
            </header>

            <form
                class="mb-8 flex flex-col gap-2 sm:flex-row"
                hx-post="{% url 'task-create-page' %}"
                hx-target="#task-section"
                hx-swap="innerHTML"
                hx-on::after-request="if (event.detail.successful) this.reset()"
            >
                {% csrf_token %}
                <label class="sr-only" for="task-title">New task title</label>
                <input
                    id="task-title"
                    name="title"
                    type="text"
                    class="input input-bordered w-full sm:max-w-md"
                    placeholder="Add a task..."
                    maxlength="200"
                    autocomplete="off"
                    required
                >
                <button type="submit" class="btn btn-primary">Add task</button>
            </form>

            <section aria-labelledby="task-list-heading">
                <h2 id="task-list-heading" class="sr-only">Your tasks</h2>
                <div id="task-section">
                    {% include "todo/_task_section.html" %}
                </div>
            </section>

            <div
                x-cloak
                :class="{ 'modal-open': modalOpen }"
                class="modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="task-modal-title"
                @click.self="modalOpen = false"
                x-init="$watch('modalOpen', open => open && $nextTick(() => $refs.closeButton.focus()))"
            >
                <article class="modal-box max-w-lg" @click.stop>
                    <header class="flex items-start justify-between gap-4">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-[0.2em] text-primary">Task details</p>
                            <h2 id="task-modal-title" class="mt-2 text-2xl font-bold" x-text="selectedTask.title"></h2>
                        </div>
                        <button
                            type="button"
                            class="btn btn-sm btn-circle btn-ghost"
                            x-ref="closeButton"
                            aria-label="Close task details"
                            @click="modalOpen = false"
                        >
                            Close
                        </button>
                    </header>
                    <p
                        class="mt-6 whitespace-pre-line text-base-content/75"
                        x-show="selectedTask.description"
                        x-text="selectedTask.description"
                    ></p>
                    <dl class="mt-6 grid grid-cols-2 gap-4 border-t border-base-300 pt-5 text-sm">
                        <div>
                            <dt class="text-xs font-bold uppercase tracking-wider text-base-content/50">Status</dt>
                            <dd class="mt-2"><span class="badge badge-outline" x-text="selectedTask.completed ? 'Completed' : 'Open'"></span></dd>
                        </div>
                        <div>
                            <dt class="text-xs font-bold uppercase tracking-wider text-base-content/50">Created</dt>
                            <dd class="mt-2 text-base-content/75" x-text="selectedTask.createdAt"></dd>
                        </div>
                        <div>
                            <dt class="text-xs font-bold uppercase tracking-wider text-base-content/50">Updated</dt>
                            <dd class="mt-2 text-base-content/75" x-text="selectedTask.updatedAt"></dd>
                        </div>
                    </dl>
                </article>
            </div>
        </main>
    </body>
</html>
