<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logged out</title>
    <style>
      body {
        align-items: center;
        background: #f4f4f5;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: white;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
        width: min(100% - 2rem, 22rem);
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #52525b;
      }

      a {
        background: #18181b;
        border-radius: 4px;
        color: white;
        display: block;
        margin-top: 1.25rem;
        padding: 0.7rem 1rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Logged out</h1>
      <p>You have been signed out of your account.</p>
      <a href="{% url 'login' %}">Log in again</a>
    </main>
  </body>
</html>
