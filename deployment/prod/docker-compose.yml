services:
  web:
    build:
      context: ../..
      dockerfile: deployment/prod/Dockerfile
    command:
      - sh
      - -c
      - alembic -c src/infrastructure/alembic/alembic.ini upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 3
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/db.sqlite3
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${PORT:-8000}:8000"
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
