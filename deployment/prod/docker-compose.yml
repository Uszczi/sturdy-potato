services:
  web:
    build:
      context: ../..
      dockerfile: deployment/prod/Dockerfile
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 3
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_DEBUG: "false"
      DJANGO_ENV: prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
    ports:
      - "${PORT:-8000}:8000"
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
