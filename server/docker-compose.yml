services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sturdy_potato
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sturdy_potato"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pulls the model into the ollama_data volume on first boot, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  # The MCP server: task tools over HTTP at http://mcp:8001/mcp. Built from the
  # repo root (uv workspace), so its context is the parent directory.
  mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sturdy_potato
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command:
      - sh
      - -c
      - alembic -c src/infrastructure/alembic/alembic.ini upgrade head && python -m cli seed && exec fastapi run src/main.py --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sturdy_potato
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      MCP_URL: http://mcp:8001/mcp
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
