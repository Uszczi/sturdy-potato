[project]
name = "sturdy-potato"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "asyncer>=0.0.8",
    "asyncpg>=0.30.0",
    "click>=8.4.2",
    "fastapi[standard]>=0.115.0",
    "itsdangerous>=2.2.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "sqladmin>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx>=0.28.0",
    "mypy>=2.3.0",
    "psycopg2-binary>=2.9.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "testcontainers[postgres]>=4.9.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/infrastructure/alembic/*", "src/cli/__main__.py"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
exclude = ["src/infrastructure/alembic/**"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "auth",
    "cli",
    "config",
    "infrastructure",
    "main",
    "schemas",
]

[tool.mypy]
mypy_path = ["src"]
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/infrastructure/alembic/"]
