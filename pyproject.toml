[project]
name = "sturdy-potato"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adrf>=0.1.14",
    "dependency-injector>=4.49.1",
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-vite>=3.1.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.34.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-browser-reload>=1.21.0",
    "django-stubs[compatible-mypy]>=6.1.0",
    "djangorestframework-stubs>=3.18.0",
    "djlint>=1.44.2",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "types-factory-boy>=0.4.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["potato"]

[tool.coverage.run]
omit = ["potato/world/*"]

[tool.ruff]
exclude = ["**/migrations/**"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "infrastructure", "serializers", "todo", "web"]

[tool.mypy]
mypy_path = ["potato"]
plugins = ["mypy_django_plugin.main"]
strict = true

# adrf (Async Django REST Framework) ships no type stubs; its untyped
# decorators/base classes force the async view modules to relax the
# corresponding strict checks.
[[tool.mypy.overrides]]
module = ["adrf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["web.views", "web.home_views", "api.views"]
disallow_untyped_decorators = false
disallow_subclassing_any = false
disable_error_code = ["type-var"]

[tool.django-stubs]
django_settings_module = "config.settings"
