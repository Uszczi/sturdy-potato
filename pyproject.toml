[project]
name = "sturdy-potato"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "asyncer>=0.0.8",
    "fastapi[standard]>=0.115.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx>=0.28.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["server"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["server/infrastructure/alembic/*"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
exclude = ["server/infrastructure/alembic/**"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "auth",
    "config",
    "db",
    "main",
    "models",
    "repositories",
    "schemas",
    "seed",
]

[tool.mypy]
mypy_path = ["server"]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["server/infrastructure/alembic/"]
